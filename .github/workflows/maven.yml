
name: Mobile Recharge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maven-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean verify
